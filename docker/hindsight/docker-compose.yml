version: '3.8'

services:
  hindsight-db:
    image: pgvector/pgvector:pg16
    container_name: nexorra-hindsight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexorra
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:-nexorra_local}
      POSTGRES_DB: hindsight
    volumes:
      - hindsight-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexorra -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hindsight-data:
